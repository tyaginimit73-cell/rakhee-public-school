<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rakhee Public School | SohanJani Tagan, Muzaffarnagar, Uttar Pradesh</title>
    <meta name="description" content="Rakhee Public School, SohanJani Tagan, Muzaffarnagar (Uttar Pradesh) — a premium school focused on academic excellence, holistic development and safe, modern learning. Admissions open." />
    <meta name="theme-color" content="#0c1b3a" />
    <link rel="canonical" href="https://www.rakheepublicschool.in/" />
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rakhee Public School" />
    <meta property="og:title" content="Rakhee Public School — Inspiring Young Minds, Building Bright Futures" />
    <meta property="og:description" content="A premium school in SohanJani Tagan, Muzaffarnagar, Uttar Pradesh. Academic excellence, holistic development and a safe, modern campus." />
    <!-- og:image must be an absolute URL (scheme + real domain) for social
         previews to reliably load it — some crawlers (Facebook's notably)
         don't reliably resolve a root-relative path like this against the
         page URL. Left as a root-relative path deliberately rather than
         guessing a domain: this project has no confirmed production domain
         anywhere (the only domain-like string in the codebase is an
         explicitly-labeled placeholder in server/config/defaultSettings.js).
         Whoever deploys this: replace the line below with the real
         absolute URL, e.g. https://www.your-actual-domain.in/images/hero-campus.jpg -->
    <meta property="og:image" content="/images/hero-campus.jpg" />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Fonts (graceful fallback when offline) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- School structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "School",
      "name": "Rakhee Public School",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "SohanJani Tagan",
        "addressLocality": "Muzaffarnagar",
        "addressRegion": "Uttar Pradesh",
        "addressCountry": "IN"
      },
      "url": "https://www.rakheepublicschool.in/"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
